name: New - Test PR on main
on:
  workflow_call:
    inputs:
      NODE_VERSION:
        required: true
        type: string
      DIFF_COVERAGE_MODE:
        description: 'PLAT-40: "warn" comenta e nao bloqueia; "enforce" reprova o check'
        required: false
        type: string
        default: 'warn'
      MIN_COVERAGE:
        description: 'PLAT-40: percentual minimo das linhas alteradas cobertas por teste'
        required: false
        type: string
        default: '80'
      COVERAGE_FILES:
        description: 'PLAT-40: glob dos relatorios LCOV'
        required: false
        type: string
        default: 'coverage/lcov.info'

jobs:
  reusable_workflow_job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5.0.1
        with:
          # PLAT-40: o Sonar precisa do historico para o blame e o diff-cover
          # precisa da branch base para calcular a cobertura do diff.
          fetch-depth: 0

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v5.0.5
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
        name: List the state of node modules
        continue-on-error: true
        run: npm list

      - name: Node version
        run: echo ${{ inputs.NODE_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:coverage

      # PLAT-40: o Sonar quer a lista separada por virgula; a action de diff
      # coverage quer separada por espaco. Deriva as duas do mesmo COVERAGE_FILES
      # para que os dois consumidores nunca leiam relatorios diferentes.
      - name: Caminho dos relatorios de cobertura
        id: cobertura
        env:
          COVERAGE_FILES: ${{ inputs.COVERAGE_FILES }}
        run: |
          set -euo pipefail
          echo "sonar=$(tr -s ' ' ',' <<<"${COVERAGE_FILES}" | sed 's/^,//;s/,$//')" >> "$GITHUB_OUTPUT"

      # PLAT-40: sem lcov.reportPaths o Sonar analisa o PR mas importa 0% de
      # cobertura ("No report imported, no coverage information will be imported").
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_MFE }}
          SONAR_HOST_URL: https://sonarqube.dev-api.portalfarm.com.br
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=${{ steps.cobertura.outputs.sonar }}

      # PLAT-40: cobertura do codigo alterado. Modo aviso na onda 2 — comenta no
      # PR e nao bloqueia merge. Promocao para enforce e decisao por repo.
      - name: Diff coverage
        if: ${{ github.event_name == 'pull_request' }}
        uses: Farm-Investimentos/devops-actions/actions/diff-coverage@main
        with:
          coverage-files: ${{ inputs.COVERAGE_FILES }}
          min-coverage: ${{ inputs.MIN_COVERAGE }}
          mode: ${{ inputs.DIFF_COVERAGE_MODE }}
          source-extensions: 'ts,tsx,js,jsx,vue'
